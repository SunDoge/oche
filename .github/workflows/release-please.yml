name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Only the CLI crate publishes; internal crates stay private.
          # Conventional commits on main drive version bumps and CHANGELOG.md.
          token: ${{ secrets.GITHUB_TOKEN }}
