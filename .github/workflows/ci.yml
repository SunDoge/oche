name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: Show tool versions
        run: |
          mise exec -- dart --version
          mise exec -- rustc --version
          mise exec -- ./target/debug/oche sdk-info || true
      - name: Build
        run: mise exec -- cargo build --workspace --all-targets
      - name: Format
        run: mise exec -- cargo fmt --check
      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: mise exec -- cargo test --workspace
      - name: Check examples
        run: |
          mise exec -- ./target/debug/oche check examples/generated_expressions.oche
