name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Pushes and pull requests use the included Linux runner. The paid macOS
    # runner is only selected when this workflow is started manually.
    name: test (${{ github.event_name == 'workflow_dispatch' && 'macos-latest' || 'ubuntu-latest' }})
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          install_args: rust dart
      - name: Show tool versions
        run: |
          mise exec -- dart --version
          mise exec -- rustc --version
          mise exec -- ./target/debug/oche sdk-info || true
      - name: Build
        run: mise exec -- cargo build --workspace --all-targets
      - name: Format
        run: mise exec -- cargo fmt --check
      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: mise exec -- cargo test --workspace
      - name: Check examples
        run: |
          mise exec -- ./target/debug/oche check examples/generated_expressions.oche
