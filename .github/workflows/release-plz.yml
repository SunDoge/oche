name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: cut releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: Run release-plz
        uses: release-plz/release-plz@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
