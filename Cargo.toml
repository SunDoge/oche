[workspace]
members = [
    "crates/dart-vm",
    "crates/frontend",
    "crates/hir",
    "crates/formatter",
    "crates/analysis",
    "crates/comptime",
    "crates/codegen",
    "crates/lsp",
    "crates/interop",
    "crates/cli",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
snafu = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pretty = "0.12.5"
usage-rs = { version = "7", features = ["completions"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
ariadne = "0.6.0"

[profile.release]
panic = "unwind"
